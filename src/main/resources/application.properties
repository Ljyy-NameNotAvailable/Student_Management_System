spring.application.name=sms-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/sms

spring.jpa.hibernate.ddl-auto=update

# Fail fast instead of lazily loading outside a transaction during serialization.
spring.jpa.open-in-view=false

# --- Actuator (step 5) -------------------------------------------------------
# Only health is exposed by default; name every endpoint you want reachable.
management.endpoints.web.exposure.include=health,info,metrics,loggers,env,beans,mappings
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
# env and beans echo configuration back; keep them off a public deployment.
management.endpoint.env.show-values=when-authorized
management.info.env.enabled=true
management.observations.annotations.enabled=true

info.app.name=sms-backend
info.app.description=Student management REST API
info.app.java-version=${java.version}

# --- Logging -----------------------------------------------------------------
logging.level.com.example.sms_backend=INFO
# Uncomment to watch the transaction boundaries the @Transactional work added:
# logging.level.org.springframework.transaction.interceptor=TRACE
# logging.level.org.hibernate.SQL=DEBUG
